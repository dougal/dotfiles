# Example backup set for restic-set and restic-backup.
#
# Copy to ~/.config/restic/sets/<name>.conf and edit. Each file describes one
# source, destination and set of exclusions. It is sourced by restic-set, so
# it is plain bash and any RESTIC_* variable restic understands works here.

export RESTIC_REPOSITORY="s3:s3.amazonaws.com/example-backups/hostname/home"
export RESTIC_PASSWORD_COMMAND="op item get restic-hostname-home --field label=password --reveal"
export RESTIC_CACHE_DIR="$HOME/Library/Caches/restic"

# Which AWS profile the s3 credentials come from. restic-set exports these as
# environment variables before running restic.
export AWS_PROFILE="personal"

# Arguments for `restic backup`: what to back up, followed by any options.
BACKUP_ARGS=(
  "$HOME"
  --exclude-file "$HOME/.config/restic/excludes/home.txt"
  --one-file-system
  --compression auto
)

# Create the repository with: restic-set <name> init
